<text x="40.0" y="790.0" font-size="15" font-weight="bold">On the socket's back</text>
<text x="40.0" y="814.0" font-size="14">•</text>
<text x="56.0" y="814.0" font-size="14">R1, 120 Ω, between pins 6 and 14.</text>
<text x="40.0" y="839.0" font-size="14">•</text>
<text x="56.0" y="839.0" font-size="14">R2 (a second 120 Ω) only if the ECM has no terminator inside: measure first.</text>
<text x="40.0" y="864.0" font-size="14">•</text>
<text x="56.0" y="864.0" font-size="14">CAN as a twisted pair to the ECM.</text>
<text x="40.0" y="889.0" font-size="14">•</text>
<text x="56.0" y="889.0" font-size="14">Every pin not labeled here: nothing.</text>
<text x="40.0" y="940.0" font-size="16" font-weight="bold">Wire side: the back of the socket, where you solder</text>
<text x="40.0" y="962.0" font-size="14" fill="#555555">Left and right swap: pin 1 is top right here and pin 16 bottom left. Trust</text>
<text x="40.0" y="981.0" font-size="14" fill="#555555">the numbers molded on your socket.</text>
