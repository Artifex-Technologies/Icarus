<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1300" height="1468" viewBox="0 0 1300 1468" font-family="Arial, Helvetica, 'Liberation Sans', FreeSans, sans-serif" font-size="14" fill="#1a1a1a">
<title>Bench OBD-II socket: J1962 face view</title>
<desc>The female J1962 (OBD-II) socket on the bench, seen from the front as the OBDLink EX plugs in: pins 1-16 in the standard layout, with the pins the bench uses labeled. A smaller wire-side view shows the mirrored numbering on the back.</desc>
<rect x="0" y="0" width="1300" height="1468" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="1260.0" height="86.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="36.0" y="46.0" font-size="16" font-weight="bold">Bench OBD-II socket: female J1962, pins 1-16</text>
<text x="36.0" y="70.0" font-size="15">2016-2017 Tacoma 3.5 L automatic, ECM 89661-04K50..04K54</text>
<text x="483.1" y="70.0" font-size="15" fill="#d01818">(other years, the 6-speed manual 04K60-04K64 and the 2.7 L: not verified)</text>
<text x="36.0" y="92.0" font-size="14" fill="#555555">drawn by Icarus, 2026-11-27, verify against Toyota TIS</text>
<text x="1264.0" y="46.0" font-size="13" text-anchor="end" fill="#555555">Sheet 3 of 3: the socket</text>
<text x="1264.0" y="66.0" font-size="13" text-anchor="end" fill="#555555">bench-wiring.svg: the whole bench</text>
<text x="1264.0" y="86.0" font-size="13" text-anchor="end" fill="#555555">power.svg: the supply side</text>
<text x="40.0" y="150.0" font-size="16" font-weight="bold">Face view: looking into the socket from the front, as the EX plugs in</text>
<text x="40.0" y="172.0" font-size="14" fill="#555555">The standard J1962 layout: pins 1-8 on the wide top row, 9-16 below, each row numbered left to right.</text>
