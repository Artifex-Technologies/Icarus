[package]
name = "icarus-obd"
description = "Icarus's link to a vehicle: OBD adapters (ELM327/STN) and the standard OBD-II services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# serial ports, Bluetooth RFCOMM sockets and poll (MIT/Apache-2.0)
libc = "0.2"
# vehicle profiles are TOML files (MIT/Apache-2.0)
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# NHTSA's answers are JSON (MIT/Apache-2.0)
serde_json = "1"
