[package]
name = "icarus-obd"
description = "Icarus's link to a vehicle: OBD adapters (ELM327/STN) and the standard OBD-II services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# module-data definitions and their decoder (no vehicle I/O)
icarus-core = { path = "../icarus-core" }
# serial ports, Bluetooth RFCOMM sockets and poll (MIT/Apache-2.0)
libc = "0.2"
# vehicle profiles are TOML files (MIT/Apache-2.0)
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# NHTSA's answers are JSON (MIT/Apache-2.0)
serde_json = "1"
# OBDex's trouble codes are kept compressed (pure Rust; MIT/Zlib/Apache-2.0)
miniz_oxide = "0.8"

[features]
# ICA-225: the window's and the command's tests keep out of the real home, as this crate's own tests do (lib.rs `env`):
# HOME and the XDG folders only ever a test's own folder in the temporary folder, the action log and the Read-Only list
# only there, and no sleep lock asked of logind. Turned on only by icarus-app's and icarus's [dev-dependencies], so only
# their test builds have it (resolver 2); never turn it on for a build that is run or packaged.
test-home = []
