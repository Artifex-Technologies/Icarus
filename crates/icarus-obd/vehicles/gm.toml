name = "GM (Chevrolet, GMC, Buick, Cadillac)"
wmi = ["1G", "2G", "3G", "KL"]
notes = """GM's transmission answers at 7EA (request 7E2). Its body modules use request IDs in the 240s answering 400 higher
(640s): a scan asks each ID of that range (unchecked addresses, named by number). Many GM modules answer GM's own
diagnostic services rather than UDS for their codes, so a module may answer without giving them."""

[[module]]
tx = 0x7E0
name = "ECM (engine)"

[[module]]
tx = 0x7E2
name = "TCM (transmission)"

# The body range as the note above has it (public: request 24x, answer 64x); which module sits at which ID varies by model,
# so each is named by its number until seen on a vehicle.
[[range]]
from = 0x240
to = 0x24F
answer_offset = 0x400
name = "body module"
