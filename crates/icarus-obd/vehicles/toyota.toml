# Toyota, Lexus, Scion. Addresses from public sources; `checked` turns true once Icarus has seen the module answer there.
name = "Toyota / Lexus / Scion"
wmi = ["JT", "2T", "3T", "4T", "5T"]
notes = """Many Toyota modules speak KWP2000 on CAN rather than UDS; Icarus tries both. Body modules sit behind ID 750 with an
extended address byte (main body 40, tire pressure 2A); Icarus reads their identity and codes through it. On many models the engine computer also runs the
automatic transmission, so 7E1 may stay silent."""

[[module]]
tx = 0x7E0
name = "engine (ECM)"

[[module]]
tx = 0x7E1
name = "transmission (ECT)"

# The engine and transmission computers' own diagnostic addresses (UDS), beside OBD-II's 7E0/7E1: where their own values
# (a dealer tool's data list) are read. Public addresses (OBDb's Toyota signal sets list them); seen answering on a 2017
# Tacoma, left unchecked until the owner decides (docs/plans/, private).
[[module]]
tx = 0x700
name = "engine (UDS)"

[[module]]
tx = 0x701
name = "transmission (UDS)"

[[module]]
tx = 0x7B0
name = "ABS / VSC / TRC (skid control)"

[[module]]
tx = 0x780
name = "airbags (SRS)"

[[module]]
tx = 0x781
name = "occupant classification"

[[module]]
tx = 0x7C0
name = "instrument cluster (combination meter)"

[[module]]
tx = 0x7C4
name = "air conditioning"

[[module]]
tx = 0x7A1
name = "electric power steering"

[[module]]
tx = 0x750
rx = 0x758
ext = 0x40
name = "main body"

# The maker's own trouble codes Icarus can explain (from public sources; add more here or in ~/.config/icarus/vehicles/).
[codes]
C1241 = "Low battery voltage (or abnormally high) at the skid control (ABS/VSC) module: often a weak battery or poor connection, not the module"
